[package]
name = "maya-studio-desktop"
version = "0.1.0"
description = "Maya Studio : application desktop (Tauri) qui lance le moteur studiod"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

# Hors de l'espace de travail Cargo racine : le shell Tauri a ses propres
# dépendances (WebView) et ne doit pas alourdir `cargo build` du moteur.
[workspace]

[lib]
name = "maya_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
log = "0.4"
# Déjà utilisé par Tauri (runtime asynchrone) : seulement pour la temporisation du redémarrage.
tokio = { version = "1", features = ["time"] }
