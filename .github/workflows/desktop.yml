name: Builds desktop

# Paquets de l'app desktop (.app/.dmg sur macOS, .msi/.exe sur Windows), signés quand les
# secrets de signature existent, sinon non signés. Lancement : à la main (Actions >
# Builds desktop > Run workflow), sur un tag v*, ou quand ce workflow change dans une PR.
#
# Secrets attendus (Settings > Secrets and variables > Actions), tous facultatifs :
#   macOS, signature : APPLE_CERTIFICATE (certificat « Developer ID Application » .p12 en base64),
#                      APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#                      (ex. « Developer ID Application: Antoine Quarroz (TEAMID) »)
#   macOS, notarisation : APPLE_ID, APPLE_PASSWORD (mot de passe d'app), APPLE_TEAM_ID
#   Windows : WINDOWS_CERTIFICATE (certificat de signature de code .pfx en base64),
#             WINDOWS_CERTIFICATE_PASSWORD
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/desktop.yml
      - .github/actions/setup-gstreamer/**

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: maya-studio-macos-arm64
            bundles: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            artifact: maya-studio-windows-x64
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-gstreamer

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Les variables lues par Tauri ne sont posées que si le secret existe : une variable
      # vide ferait échouer la signature au lieu de la sauter.
      - name: Signature macOS (si secrets)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              # Délimiteur : supporte un base64 coupé en plusieurs lignes.
              printf 'APPLE_CERTIFICATE<<__CERT__\n%s\n__CERT__\n' "$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "Signature Developer ID : activée"
            if [ -n "$APPLE_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "Notarisation : activée"
            fi
          else
            echo "::notice::Pas de certificat Apple : build non signé."
          fi

      - name: Signature Windows (si secrets)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "::notice::Pas de certificat Windows : build non signé."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "signature.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pass = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
          Remove-Item $pfx
          # Surcharge de tauri.conf.json : Tauri signe l'exe, le sidecar et les installeurs.
          $conf = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } } | ConvertTo-Json -Depth 5
          $path = Join-Path $env:RUNNER_TEMP "tauri.signature.json"
          Set-Content -Path $path -Value $conf -Encoding utf8
          "TAURI_SIGNING_CONF=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Signature Authenticode : activée"

      # beforeBuildCommand compile studiod en release (sidecar) puis le front-end.
      - name: Construire l'app
        shell: bash
        working-directory: apps/desktop
        run: |
          args=(build)
          if [ -n "${TAURI_SIGNING_CONF:-}" ]; then args+=(--config "$TAURI_SIGNING_CONF"); fi
          npx tauri "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
