name: Installer GStreamer
description: >
  Installe GStreamer (bibliothèques de développement + plugins base, good, bad, ugly, libav),
  pkg-config et ffmpeg (ffprobe sert aux tests), sur macOS (Homebrew) ou Windows (MSI officiels MSVC).

inputs:
  windows-version:
    description: >
      Version des paquets MSVC officiels de GStreamer pour Windows, ou « latest » pour la
      dernière version stable (mineure paire) publiée sur gstreamer.freedesktop.org.
    default: "latest"

runs:
  using: composite
  steps:
    - name: GStreamer (macOS, Homebrew)
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: |
        brew install gstreamer ffmpeg pkgconf
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
        gst-launch-1.0 --version

    - name: Version de GStreamer (Windows)
      id: gstver
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GST_VERSION: ${{ inputs.windows-version }}
      run: |
        $ErrorActionPreference = "Stop"
        $ver = $env:GST_VERSION
        if ($ver -eq "latest") {
          $index = (Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/" -UseBasicParsing).Content
          $ver = [regex]::Matches($index, 'href="(1\.\d+\.\d+)/"') |
            ForEach-Object { $_.Groups[1].Value } |
            Where-Object { ([int]($_.Split(".")[1])) % 2 -eq 0 } |
            Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $ver) { throw "aucune version trouvée dans l'index des paquets Windows" }
        }
        Write-Host "GStreamer $ver"
        "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Cache des installeurs (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/gstreamer-msi
        key: gstreamer-msi-msvc-x86_64-${{ steps.gstver.outputs.version }}

    - name: GStreamer (Windows, installeur officiel MSVC)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GST_VERSION: ${{ steps.gstver.outputs.version }}
      run: |
        $ErrorActionPreference = "Stop"
        $ver = $env:GST_VERSION
        $dir = Join-Path $env:RUNNER_TEMP "gstreamer-msi"
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
        $listing = (Invoke-WebRequest -Uri "$base/" -UseBasicParsing).Content
        $files = [regex]::Matches($listing, 'href="([^"?/]+)"') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
        Write-Host "Paquets disponibles :"; $files | ForEach-Object { Write-Host "  $_" }
        $msis = @("gstreamer-1.0-msvc-x86_64-$ver.msi", "gstreamer-1.0-devel-msvc-x86_64-$ver.msi")
        $exe = "gstreamer-1.0-msvc-x86_64-$ver.exe"
        if ($files -contains $exe) {
          # Depuis 1.28 : un seul installeur .exe (Inno Setup) avec runtime et développement.
          $path = Join-Path $dir $exe
          if (-not (Test-Path $path)) { Invoke-WebRequest -Uri "$base/$exe" -OutFile $path }
          $log = Join-Path $env:RUNNER_TEMP "gstreamer-install.log"
          $p = Start-Process $path -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/ALLUSERS", "/TYPE=full", "/DIR=C:\gstreamer", "/LOG=$log") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 50; throw "installeur $exe : code $($p.ExitCode)" }
        } elseif (($files -contains $msis[0]) -and ($files -contains $msis[1])) {
          foreach ($name in $msis) {
            $msi = Join-Path $dir $name
            if (-not (Test-Path $msi)) { Invoke-WebRequest -Uri "$base/$name" -OutFile $msi }
            # ADDLOCAL=ALL : installation complète (tous les plugins, dont openh264 et libav).
            $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart", "ADDLOCAL=ALL") -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "msiexec $name : code $($p.ExitCode)" }
          }
        } else {
          throw "ni installeur .exe ni paquets MSI pour $ver dans $base"
        }

        # L'installeur publie la racine dans une variable machine, pas dans ce shell.
        $root = [Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
        if (-not $root) {
          $root = @("C:\gstreamer\1.0\msvc_x86_64", "C:\gstreamer", "C:\Program Files\gstreamer\1.0\msvc_x86_64") |
            Where-Object { Test-Path (Join-Path $_ "bin\gst-launch-1.0.exe") } | Select-Object -First 1
        }
        if (-not $root) {
          $found = Get-ChildItem "C:\gstreamer", "C:\Program Files\gstreamer" -Recurse -Filter gst-launch-1.0.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { $root = Split-Path (Split-Path $found.FullName) }
        }
        if (-not $root) { throw "racine GStreamer introuvable après installation" }
        $root = $root.TrimEnd("\")
        Write-Host "GStreamer installé dans $root"
        if (-not (Test-Path "$root\lib\pkgconfig\gstreamer-1.0.pc")) {
          Get-ChildItem $root | Format-Table -AutoSize | Out-String | Write-Host
          throw "fichiers de développement absents ($root\lib\pkgconfig\gstreamer-1.0.pc)"
        }

        "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "PKG_CONFIG_PATH=$root\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        # pkg-config : celui livré avec GStreamer s'il existe, sinon pkgconfiglite.
        $pc = Join-Path $root "bin\pkg-config.exe"
        if (Test-Path $pc) {
          "PKG_CONFIG=$pc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        } else {
          choco install pkgconfiglite -y --no-progress
        }

        # ffprobe pour vérifier les fichiers enregistrés dans les tests.
        if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
          choco install ffmpeg -y --no-progress
        }

        & "$root\bin\gst-launch-1.0.exe" --version
