[package]
name = "studiod"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
studio-core = { path = "../studio-core" }
suite-protocol = { path = "../suite-protocol" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
base64.workspace = true
clap.workspace = true
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[features]
default = ["gstreamer"]
# Backend de sortie GStreamer in-process (LGPL). Sans lui, seul le backend ffmpeg provisoire reste.
gstreamer = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "studiod"
path = "src/main.rs"
